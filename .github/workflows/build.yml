name: Build
permissions:
  contents: write
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
jobs:

  Test-Scripts:
    runs-on: windows-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Python scripts
        shell: pwsh
        working-directory: packages\common
        run: python -m unittest mkzip

  Build-Prerequisites:
    runs-on: windows-latest
    needs: Test-Scripts
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2

      - name: Turn off git autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check OpenOCD repository
        shell: pwsh
        run: .\packages\common\build-id.ps1 openocd .\config\x64-compile.json >> $env:GITHUB_ENV

      - name: Cache OpenOCD build
        uses: actions/cache@v5
        with:
          path: build/openocd-install
          key: ${{ env.OPENOCD_BUILD_ID }}-${{ hashFiles('packages/openocd/**') }}

      - name: Check riscv-gnu-toolchain repository
        shell: pwsh
        run: .\packages\common\build-id.ps1 riscv-gnu-toolchain .\config\x64-compile.json >> $env:GITHUB_ENV

      - name: Cache riscv-gnu-toolchain build
        uses: actions/cache@v5
        with:
          path: build/riscv-gnu-toolchain-install
          key: ${{ env.RISCV_GNU_TOOLCHAIN_BUILD_ID }}-${{ hashFiles('packages/riscv/**') }}

      - name: Compile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          subst P: .
          P:

          .\build.ps1 -CompileConfig .\config\x64-compile.json -MSYS2Path (msys2 -c 'cygpath -m /').TrimEnd('\/') -Target Download,Compile

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Build-x64
          path: |
            build/pico-sdk-tools
            build/openocd-install
            build/riscv-gnu-toolchain-install

  Build-Installer:
    runs-on: windows-latest
    needs: Build-Prerequisites
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: x64, build-type: system, target: Installer }
          - { config: x64-standalone, build-type: user, target: Installer }
          - { config: x64-standalone, build-type: user, target: Archive }
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Turn off git autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Build-x64
          path: build

      - name: Build ${{ matrix.config }} ${{ matrix.target }} (${{ matrix.build-type }})
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          subst P: .
          P:

          .\build.ps1 -CompileConfig .\config\x64-compile.json -InstallerConfig .\config\${{ matrix.config }}.json -Compression Best -BuildType ${{ matrix.build-type }} -Target Download,${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Package-${{ matrix.config }}-${{ matrix.build-type }}-${{ matrix.target }}
          path: |
            bin/
            build/version.txt

  Test-Installer:
    runs-on: ${{ matrix.winver.host }}
    needs: Build-Installer
    strategy:
      fail-fast: false
      matrix:
        winver:
          - { host: windows-latest, image: ltsc2025 }
          - { host: windows-latest, image: ltsc2022 }
          - { host: windows-11-arm, image: ltsc2025-arm64, test-args: -Quick }
        installer:
          - { config: x64, build-type: system, target: Installer }
          - { config: x64-standalone, build-type: user, target: Installer }
          - { config: x64-standalone, build-type: user, target: Archive }
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: Package-${{ matrix.installer.config }}-${{ matrix.installer.build-type }}-${{ matrix.installer.target }}

      # Windows 11 ARM64 runners are on Pacific timezone by default.
      # Extracted zips then get files in the future as the timestamps are based on the local timezone,
      # which causes CMake to fail.
      - name: Set timezone
        shell: pwsh
        run: Set-TimeZone -Id UTC

      # Windows 11 ARM64 runners do not have Docker installed
      - name: Setup Docker (Windows ARM64)
        if: matrix.winver.host == 'windows-11-arm'
        uses: ndabas/setup-moby-windows-arm64@v1

      - name: Wait for Docker daemon
        shell: pwsh
        run: |
          Start-Service docker
          for ($i = 0; $i -lt 30; $i++) {
            docker version *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          }
          throw 'Docker daemon did not become available'

      - name: Test ${{ matrix.installer.config }} (${{ matrix.installer.build-type }})
        shell: pwsh
        run: docker run --rm -v "$(Get-Location):C:\repo" -w C:\repo
          mcr.microsoft.com/windows/servercore:${{ matrix.winver.image }}
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\setup.ps1 ${{ matrix.winver.test-args }}

      - name: Upload installer logs
        uses: actions/upload-artifact@v7
        with:
          name: Installer-Logs-Windows-${{ matrix.winver.image }}-${{ matrix.installer.config }}-${{ matrix.installer.build-type }}
          path: logs/

  Publish-Release:
    runs-on: windows-latest
    needs: Test-Installer
    if: github.event_name == 'push'
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: Package-*
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/publish-release.sh
